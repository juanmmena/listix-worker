name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:
  pr-title:
    name: Validate PR Title
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    steps:
      - name: Validate PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  commitlint:
    name: Lint Commit Messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Validate PR commits with commitlint
        uses: wagoid/commitlint-github-action@v6

  pr-size:
    name: Check Pull Request Size
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Analyze PR Size & Apply Label
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const additions = pr.additions;
            const deletions = pr.deletions;
            const totalChanges = additions + deletions;

            const sizeCategories = [
              { name: 'size/XS', max: 50, color: '3CBF00', description: 'Tiny pull request (< 50 lines)' },
              { name: 'size/S',  max: 200, color: '5D9801', description: 'Small pull request (50-200 lines)' },
              { name: 'size/M',  max: 500, color: 'EAA900', description: 'Medium pull request (200-500 lines)' },
              { name: 'size/L',  max: 1000, color: 'D15600', description: 'Large pull request (500-1000 lines)' },
              { name: 'size/XL', max: Infinity, color: 'B60205', description: 'Very large pull request (> 1000 lines)' },
            ];

            const matchedCategory = sizeCategories.find(c => totalChanges < c.max) || sizeCategories[sizeCategories.length - 1];
            const targetLabel = matchedCategory.name;
            const sizeNames = sizeCategories.map(c => c.name);

            try {
              await github.rest.issues.getLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: matchedCategory.name,
              });
            } catch (err) {
              if (err.status === 404) {
                await github.rest.issues.createLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  name: matchedCategory.name,
                  color: matchedCategory.color,
                  description: matchedCategory.description,
                });
              } else {
                throw err;
              }
            }

            const { data: currentLabels } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
            });

            for (const label of currentLabels) {
              if (sizeNames.includes(label.name) && label.name !== targetLabel) {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.number,
                  name: label.name,
                });
              }
            }

            const alreadyHasLabel = currentLabels.some(label => label.name === targetLabel);
            if (!alreadyHasLabel) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                labels: [targetLabel],
              });
            }

            const summary = [
              '### Pull Request Size Analysis',
              `| Metric | Count |`,
              `| --- | --- |`,
              `| Additions | +${additions} |`,
              `| Deletions | -${deletions} |`,
              `| **Total Changes** | **${totalChanges} lines** |`,
              `| **Size Rating** | **${targetLabel}** |`,
            ].join('\n');

            await core.summary.addRaw(summary).write();

  validate:
    name: Lint, Build & Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm run db:generate

      - name: Run linter
        run: pnpm run lint

      - name: Build application
        run: pnpm run build
        env:
          DATABASE_URL: postgresql://listix:listix@localhost:5432/listix?schema=public
          JWT_ACCESS_SECRET: ci-jwt-access-secret-minimum-32-chars-long
          PUBLIC_BASE_URL: http://localhost:3000

      - name: Run unit tests with coverage
        run: pnpm run test:cov
